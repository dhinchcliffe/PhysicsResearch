name: Restore exact frozen CSV bytes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-frozen-csv.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Restore only two checksum-verified files from the original archive
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          expected = {
              'dp_comparison.csv': '01004e5ff5d9d83e7417eb771b719c1fc8737cf963b62bc206eea5d6f751566c',
              'negativity_vs_phase.csv': '3eac9cd16b969d359bd832eaa3a7f62b2ab498440e4651e923a4782d26a6a90e',
          }
          data = (root / 'archives/gravity-witness-cycle01.zip').read_bytes()
          if hashlib.sha256(data).hexdigest() != '8495cd484007c6c0f9b2ba834e41e16169595c1efc282d2769d09230bd575f09':
              raise SystemExit('Original archive checksum mismatch.')
          if '*.csv -text' not in (root / '.gitattributes').read_text():
              raise SystemExit('CSV byte-preservation attribute missing.')
          paths = []
          with zipfile.ZipFile(root / 'archives/gravity-witness-cycle01.zip') as archive:
              for name, digest in expected.items():
                  content = archive.read('gravity-witness/results/' + name)
                  if hashlib.sha256(content).hexdigest() != digest:
                      raise SystemExit('Original CSV checksum mismatch.')
                  path = root / 'projects/gravity-witness/results/cycle01' / name
                  path.write_bytes(content)
                  paths.append(str(path.relative_to(root)))
          subprocess.run(['python3', 'tools/verify_artifacts.py'], check=True)
          subprocess.run(['git', 'add', '--'] + paths, check=True)
          for path in paths:
              stored = subprocess.check_output(['git', 'show', ':' + path])
              if hashlib.sha256(stored).hexdigest() != expected[pathlib.Path(path).name]:
                  raise SystemExit('Git index did not preserve the exact CSV bytes.')
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              print('Frozen CSV bytes already match; no changes needed.')
          else:
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'commit', '-m', 'Preserve exact archived CSV bytes after clean-checkout integrity audit'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          print('Verified exact CSV bytes and all frozen research artifacts.')
          PY
