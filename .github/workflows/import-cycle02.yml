name: One-time Cycle 02 evidence import
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  import:
    if: >-
      github.event.issue.title == 'Import audited Gravity Witness Cycle02 33a1d56d' &&
      github.event.issue.user.login == 'dhinchcliffe'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned scientific dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Check checksum, allowlist, numerical proofs and import exact Cycle 02
        env:
          EXPECTED_PACKAGE_SHA256: 33a1d56d74e9e7fc5645104adacf23bf121581a72ed7212fa1ca547538276b73
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, stat, subprocess, urllib.parse, urllib.request, zipfile
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          url=json.loads(event['issue']['body'])['download_url']
          print('::add-mask::'+url)
          parts=urllib.parse.urlsplit(url)
          if parts.scheme != 'https' or not (parts.hostname or '').endswith('.oaiusercontent.com'):
              raise SystemExit('Invalid package origin')
          with urllib.request.urlopen(url,timeout=60) as response:
              final=urllib.parse.urlsplit(response.geturl())
              if not any((final.hostname or '').endswith(x) for x in ('.oaiusercontent.com','.blob.core.windows.net')):
                  raise SystemExit('Package redirect blocked')
              data=response.read(2000000)
          if len(data)>2000000: raise SystemExit('Package exceeds 2MB')
          actual=hashlib.sha256(data).hexdigest()
          if actual!=os.environ['EXPECTED_PACKAGE_SHA256']: raise SystemExit('Unexpected package SHA256')
          allowed={
              'projects/gravity-witness/src/gravity_witness/constraints.py',
              'projects/gravity-witness/scripts/run_constraints.py',
              'projects/gravity-witness/tests/test_constraints.py',
              'projects/gravity-witness/notes/cycle02_constraints.md',
              'projects/gravity-witness/results/cycle02/constraints.json',
              'projects/gravity-witness/results/cycle02/scenarios.csv',
              'projects/gravity-witness/results/cycle02/claims.json',
              'projects/gravity-witness/results/cycle02/sources.json',
              'projects/gravity-witness/figures/cycle02/conditional_force.png',
              'projects/gravity-witness/figures/cycle02/shield_ratio.png',
          }
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              members=z.infolist()
              if len(members)!=len(allowed) or {x.filename for x in members}!=allowed:
                  raise SystemExit('Package path allowlist mismatch')
              if sum(x.file_size for x in members)>4000000: raise SystemExit('Zip expansion over 4MB')
              root=pathlib.Path.cwd().resolve()
              for m in members:
                  p=pathlib.PurePosixPath(m.filename)
                  if p.is_absolute() or '..' in p.parts or stat.S_ISLNK(m.external_attr >> 16):
                      raise SystemExit('Unsafe path')
                  dst=root.joinpath(*p.parts)
                  if not dst.resolve().is_relative_to(root) or dst.exists():
                      raise SystemExit('Refusing overwrite')
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(z.read(m))
          subprocess.run(['python3','tools/verify_artifacts.py'],check=True)
          subprocess.run(['python','-m','pytest','-q','projects/gravity-witness/tests/test_constraints.py'],check=True)
          subprocess.run(['python','projects/gravity-witness/scripts/run_constraints.py'],check=True,env={**os.environ,'PYTHONPATH':'projects/gravity-witness/src'})
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+sorted(allowed),check=True)
          subprocess.run(['git','commit','-m','Cycle 02: audit DP finite-sphere and physical constraints'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('Imported 10 Cycle02 research files; source SHA256:',actual)
          PY
