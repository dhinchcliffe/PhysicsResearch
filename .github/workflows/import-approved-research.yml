name: Import approved research artifacts
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  import:
    if: >-
      github.event.issue.title == 'Import approved PhysicsResearch package d9c6c5fa' &&
      github.event.issue.user.login == 'dhinchcliffe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Download, verify and import only the approved package
        env:
          EXPECTED_PACKAGE_SHA256: d9c6c5facc4173d21ac44a60c7d2ab2bececfbbe5caee614955a19688ad02a3d
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, stat, subprocess, sys, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          payload = json.loads(event['issue']['body'])
          url = payload['download_url']
          print('::add-mask::' + url)
          parts = urllib.parse.urlsplit(url)
          if parts.scheme != 'https' or not (parts.hostname or '').endswith('.oaiusercontent.com'):
              raise SystemExit('Only a scoped artifact download URL is accepted.')
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  final = urllib.parse.urlsplit(response.geturl())
                  if not any((final.hostname or '').endswith(s) for s in ('.oaiusercontent.com', '.blob.core.windows.net')):
                      raise RuntimeError('Unexpected download redirect host')
                  data = response.read(8 * 1024 * 1024 + 1)
          except Exception:
              raise SystemExit('Artifact download failed; no URL or credential is written to logs.')
          if len(data) > 8 * 1024 * 1024:
              raise SystemExit('Package exceeded its size limit.')
          digest = hashlib.sha256(data).hexdigest()
          if digest != os.environ['EXPECTED_PACKAGE_SHA256']:
              raise SystemExit('Package checksum mismatch.')
          root = pathlib.Path.cwd().resolve()
          allowed = {'README.md', 'CONTRIBUTING.md', 'requirements.lock', 'pyproject.toml', '.python-version', '.gitignore', '.gitattributes', 'archives', 'docs', 'projects', 'provenance', 'tests', 'tools'}
          archive = zipfile.ZipFile(io.BytesIO(data))
          entries = archive.infolist()
          if len(entries) > 300 or sum(x.file_size for x in entries) > 20 * 1024 * 1024:
              raise SystemExit('Archive expanded size exceeds its limit.')
          target_paths = []
          for entry in entries:
              path = pathlib.PurePosixPath(entry.filename)
              if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] not in allowed:
                  raise SystemExit('Unsafe archive path.')
              if any(p in {'.git', '.github', '__pycache__'} for p in path.parts):
                  raise SystemExit('Disallowed archive path.')
              if stat.S_ISLNK(entry.external_attr >> 16):
                  raise SystemExit('Symlinks are not accepted.')
              destination = root.joinpath(*path.parts)
              if not destination.resolve().is_relative_to(root):
                  raise SystemExit('Path escapes repository.')
              if destination.exists() and path.as_posix() != 'README.md':
                  raise SystemExit('Refusing to replace an existing non-README artifact.')
              target_paths.append((entry, destination))
          readme = root / 'README.md'
          current = subprocess.check_output(['git', 'hash-object', str(readme)], text=True).strip()
          if current != 'f0c01cefedbc2a534972666c24a6b5b680053d02':
              raise SystemExit('README changed after inspection; reconcile before import.')
          for entry, destination in target_paths:
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(archive.read(entry))
          receipt = {'imported_at_utc': datetime.now(timezone.utc).isoformat(), 'package_sha256': digest,
                     'files_in_package': len(entries), 'repository': os.environ['GITHUB_REPOSITORY'],
                     'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                     'scope': 'approved research artifacts only; source exports preserved; no sharing changes'}
          (root / 'provenance/migration/github-import.json').write_text(json.dumps(receipt, indent=2) + '\n')
          subprocess.run(['python3', 'tools/verify_artifacts.py'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          paths = [str(p.relative_to(root)) for _, p in target_paths] + ['provenance/migration/github-import.json']
          subprocess.run(['git', 'add', '--'] + paths, check=True)
          subprocess.run(['git', 'commit', '-m', 'Import Gravity Witness with reproducible structure, atlas and detailed research guide'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          print('Imported and verified', len(entries), 'approved package files.')
          print('Published commit:', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
