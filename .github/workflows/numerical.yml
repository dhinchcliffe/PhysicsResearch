name: Numerical reproduction
on:
  push:
    branches: [main]
    paths:
      - 'projects/gravity-witness/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.lock'
      - 'pyproject.toml'
      - '.gitattributes'
      - 'provenance/migration/immutable-sha256.json'
      - '.github/workflows/numerical.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact Python dependency versions
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Verify frozen artifacts
        run: python tools/verify_artifacts.py
      - name: Check repository tooling
        run: python -m pytest -q tests --junitxml=build/repository-tests.xml
      - name: Reproduce 970 scientific checks and compare original predictions
        run: python tools/reproduce.py --output build/gravity-witness/ci
      - name: Preserve actual execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numerical-evidence-${{ github.sha }}
          path: build/
          if-no-files-found: warn
          retention-days: 30
